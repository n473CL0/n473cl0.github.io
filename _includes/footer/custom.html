<!-- Enter/Space work on the theme switch. Only block comments and explicit semicolons: compress_html can join these lines. -->
<script>
  (function () {
    /* the theme switch is a link (the nav script claims every <button> in #site-nav), so give it button keys */
    var themeSwitch = document.querySelector("#theme-toggle a");
    if (themeSwitch) {
      themeSwitch.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          themeSwitch.click();
        }
      });
    }
  })();
</script>
